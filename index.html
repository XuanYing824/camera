<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#174c3c">

  <title>BlindPath | Route Planner Demo</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f6fa;
      color: #172033;
      line-height: 1.5;
    }

    header {
      background: #174c3c;
      color: white;
      padding: 22px 16px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 6px;
    }

    header p {
      margin: 0;
    }

    .container {
      max-width: 1000px;
      margin: 24px auto;
      padding: 0 16px;
    }

    .panel {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 16px;
      box-shadow: 0 2px 10px #0000000d;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 14px 0 6px;
    }

    input,
    select {
      display: block;
      width: 100%;
      min-height: 46px;
      padding: 11px;
      border: 2px solid #ccd3dd;
      border-radius: 7px;
      background: white;
      color: #172033;
      font: inherit;
    }

    button {
      border: 2px solid #17694e;
      border-radius: 7px;
      padding: 11px 15px;
      margin: 12px 6px 0 0;
      cursor: pointer;
      font: inherit;
      font-weight: bold;
      background: #17694e;
      color: white;
    }

    button.secondary {
      background: #e6eee9;
      color: #174c3c;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 4px solid #e4a11b;
      outline-offset: 2px;
    }

    #map {
      width: 100%;
      height: 440px;
      border-radius: 12px;
      z-index: 1;
    }

    #status {
      margin-top: 14px;
      padding: 12px;
      background: #edf5f0;
      border-radius: 8px;
      overflow-wrap: anywhere;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 16px;
    }

    .stat {
      background: #edf5f0;
      padding: 16px;
      border-radius: 8px;
    }

    .stat strong {
      display: block;
      font-size: 22px;
      margin-top: 6px;
    }

    .hint {
      color: #586575;
      font-size: 13px;
      line-height: 1.5;
    }

    .notice {
      background: #fff4d6;
      border-left: 5px solid #9b6700;
      padding: 12px;
      border-radius: 7px;
    }

    #directions {
      padding-left: 24px;
    }

    #directions li {
      padding: 5px 0;
    }

    /* ==============================
       CAMERA STYLES
       ============================== */

    .camera-section {
      margin-top: 18px;
      padding-top: 8px;
    }

    #cameraContainer {
      margin-top: 14px;
      padding: 14px;
      background: #edf5f0;
      border-radius: 10px;
    }

    #cameraPreview {
      display: block;
      width: 100%;
      max-width: 650px;
      min-height: 250px;
      background: #000;
      border-radius: 10px;
      object-fit: cover;
      margin-bottom: 10px;
    }

    #capturedPhoto {
      display: block;
      width: 100%;
      max-width: 650px;
      margin-top: 14px;
      border-radius: 10px;
      border: 2px solid #ccd3dd;
    }

    .photo-result {
      margin-top: 14px;
      padding: 12px;
      background: white;
      border-radius: 8px;
    }
